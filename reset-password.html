<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f3">
    <meta name="referrer" content="no-referrer">
    <title>Choose a new password · FAA Regulations Study Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="reset-password.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand" href="/login" aria-label="Return to sign in">
        <span class="brand-mark" aria-hidden="true">
          <img src="aircraft-front-view.png" alt="">
        </span>
        <span>FAR NOTES <span class="brand-divider">/</span> FAA REGS</span>
      </a>
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="eyebrow"><span class="eyebrow-line"></span> ACCOUNT RECOVERY</div>
        <h1 id="auth-title">Choose a new password.</h1>
        <p class="auth-copy">Use at least 15 characters for your new password.</p>
        <form id="reset-form">
          <label class="auth-label" for="new-password">New password</label>
          <input class="auth-input" id="new-password" name="password" type="password" autocomplete="new-password" minlength="15" required>
          <label class="auth-label" for="confirm-password">Confirm new password</label>
          <input class="auth-input" id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="15" required>
          <p class="form-error" id="reset-error" role="alert" hidden></p>
          <p class="form-success" id="reset-success" role="status" hidden>Password updated. You can now sign in with your new password.</p>
          <button class="auth-submit" type="submit">Set new password</button>
        </form>
        <a class="auth-link" href="/login">Back to sign in</a>
      </section>
    </main>
  </body>
</html>
